name: Sync all ClaudeSkills directory records (metadata)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/index_claudeskills_info.py'
      - '.github/workflows/sync-claudeskills-info.yml'

permissions:
  contents: write

concurrency:
  group: claudeskills-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Crawl every page (do not download community scripts)
        run: python scripts/index_claudeskills_info.py --expected 42824 --workers 4 --min-coverage 0.90
      - name: Upload result and source audit even when partial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claudeskills-index
          path: |
            codex-plugins/claude-skills-hub/index/catalog.json
            codex-plugins/claude-skills-hub/index/last-fetch-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit validated metadata index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-plugins/claude-skills-hub/index/catalog.json codex-plugins/claude-skills-hub/index/last-fetch-summary.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Update ClaudeSkills.info full public skills index"
            git push origin HEAD:main
          fi
