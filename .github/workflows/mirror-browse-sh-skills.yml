name: Mirror all browse-sh Skills (quarantined)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mirror_browse_sh_skills.py'
      - '.github/workflows/mirror-browse-sh-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-browse-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch up-to-date complete upstream catalog
        run: python scripts/export_skillhub_catalog.py --output skills-index-export
      - name: Download browse-sh SKILL.md files without executing any content
        run: python scripts/mirror_browse_sh_skills.py --catalog skills-index-export/skills-catalog.json --output browse-skills-export
      - name: Upload archive and detailed success/failure ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browse-sh-skill-bundles
          path: browse-skills-export/
          retention-days: 30
          if-no-files-found: warn
