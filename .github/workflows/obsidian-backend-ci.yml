name: Obsidian session backend
on:
  push:
    branches: [feat/obsidian-session-backend-20261025]
    paths:
      - '.github/workflows/obsidian-backend-ci.yml'
      - 'hermes_obsidian_state.py'
      - 'hermes_state.py'
      - 'gateway/session.py'
      - 'gateway/platforms/helpers.py'
      - 'tests/test_obsidian_session_state.py'
      - 'scripts/migrate_kanban_to_vault.py'
      - 'tests/test_kanban_migration_guards.py'
      - 'hermes_cli/kanban_db.py'
      - 'tests/test_kanban_vault_metadata.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/obsidian-backend-ci.yml'
      - 'hermes_obsidian_state.py'
      - 'hermes_state.py'
      - 'gateway/session.py'
      - 'gateway/platforms/helpers.py'
      - 'tests/test_obsidian_session_state.py'
      - 'scripts/migrate_kanban_to_vault.py'
      - 'tests/test_kanban_migration_guards.py'
      - 'hermes_cli/kanban_db.py'
      - 'tests/test_kanban_vault_metadata.py'
  workflow_dispatch:
jobs:
  obsidian-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal gateway import dependency
        run: python -m pip install PyYAML
      - name: SQLite-free backend regression
        # -t . keeps tests/gateway from shadowing the real gateway package.
        run: python -m unittest discover -s tests -t . -p 'test_obsidian_session_state.py' -v
      - name: Kanban read-only migration safety regression
        run: python -m unittest discover -s tests -t . -p 'test_kanban_migration_guards.py' -v
      - name: Kanban Vault metadata regression
        run: python -m unittest discover -s tests -t . -p 'test_kanban_vault_metadata.py' -v
      - name: Syntax verification
        run: python -m py_compile hermes_state.py hermes_obsidian_state.py scripts/migrate_sessions_to_obsidian.py scripts/migrate_kanban_to_vault.py gateway/session.py gateway/platforms/helpers.py
