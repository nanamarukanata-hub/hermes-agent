name: Verify indexed ClaudeSkills can be used through Codex MCP

on:
  pull_request:
    paths:
      - 'codex-plugins/claude-skills-hub/**'
      - 'scripts/verify_claudeskills_live_index.py'
      - '.github/workflows/claudeskills-live-index.yml'
  push:
    branches: [main]
    paths:
      - 'codex-plugins/claude-skills-hub/index/**'
      - 'codex-plugins/claude-skills-hub/scripts/**'
      - 'scripts/verify_claudeskills_live_index.py'
      - '.github/workflows/claudeskills-live-index.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/verify_claudeskills_live_index.py
